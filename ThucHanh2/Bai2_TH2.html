<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Goals</title>
    <link rel="stylesheet" href="Bai2_TH2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="banner">

        <header>
            <nav>
                <div class="logo">TRAVEL GOALS</div>
                <ul>
                    <li><a href="#">Destinations</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
        </header>

        <section class="hero">
            <div class="hero-content">
                <h1>JOE'S TRAVEL PAGE</h1>
                <p>LET'S EXPLORE THE WORLD TOGETHER</p>
                <button>Discover places</button>
            </div>
        </section>

    </div>

    <!-- HIGHLIGHTS -->
    <section class="highlights">
        <h2>HIGHLIGHTS</h2>

        <div class="cards">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="">
                <p>MIAMI USA</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1528909514045-2fa4ac7a08ba?auto=format&fit=crop&w=1200&q=80" alt="">
                <p>MUNICH GERMANY</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1505761671935-60b3a7427bad" alt="">
                <p>BARCELONA SPAIN</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="social">
            <i class="fab fa-instagram"></i>
            <i class="fab fa-facebook"></i>
        </div>
    </footer>
</body>
</html>
