<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Bai1_TH2.css">
</head>
<body>

<div class="container">
    <h2>Get in touch with us by filling contact form below</h2>

    <form>
        <div class="row">
            <input type="text" placeholder="* Enter your full name">
            <input type="email" placeholder="* Enter your email address">
        </div>
        <input type="text" placeholder="Enter your subject" class="full-width">
        <textarea placeholder="* Your message here..." rows="8"></textarea>
        <div class="bottom-row">
            <button type="submit">Send message</button>
            <p class="note">* Please fill all required form field, thanks!</p>
        </div>

    </form>
</div>

</body>
</html>
