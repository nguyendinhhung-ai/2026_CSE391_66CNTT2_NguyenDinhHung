<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Bai2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="step-progress">
        <div class="progress-info">Bước <span id="currentStepText">1</span> / 3</div>
        <div class="progress-track">
            <div id="mainProgressBar"></div>
        </div>
    </div>

    <form id="multiStepForm" novalidate>
        <div class="form-step">
            <h3>Bước 1: Thông tin cá nhân</h3>
            <div class="form-group">
                <label>Họ và tên</label>
                <span id="fullnameCount" class="count">0/50</span>
                <input type="text" id="fullname" placeholder="Nhập họ và tên..." maxlength="50">
                <span id="fullnameError" class="error"></span>
            </div>
            <div class="form-group">
                <label>Ngày sinh</label>
                <input type="date" id="dob">
                <span id="dobError" class="error"></span>
            </div>
            <div class="form-group">
                <label>Giới tính</label>
                <input type="radio" name="gender" value="Nam"> Nam
                <input type="radio" name="gender" value="Nữ"> Nữ
                <span id="genderError" class="error"></span>
            </div>
        </div>

        <div class="form-step">
            <h3>Bước 2: Thông tin tài khoản</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="name@domain.com">
                <span id="emailError" class="error"></span>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="password-box">
                    <input type="password" id="password" placeholder="Tối thiểu 8 ký tự...">
                    <i class="fas fa-eye" id="togglePassword"></i>
                </div>
                <div class="strength">
                    <div id="strengthBar"></div>
                </div>
                <span id="passwordError" class="error"></span>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword">
                <span id="confirmPasswordError" class="error"></span>
            </div>
        </div>

        <div class="form-step">
            <h3>Bước 3: Xác nhận thông tin</h3>
            <div id="summaryBox" style="background: #eee; padding: 10px; border-radius: 5px; margin-bottom: 10px;"></div>
            <div class="form-group">
                <input type="checkbox" id="terms"> Tôi đồng ý điều khoản
                <span id="termsError" class="error"></span>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" id="prevBtn">Quay lại</button>
            <button type="button" id="nextBtn">Tiếp theo</button>
            <button type="submit" id="submitBtn" style="background: #2ecc71;">Hoàn tất 🎉</button>
        </div>
    </form>

    <div id="successMessage" class="hidden">
        <h2>Đăng ký thành công!</h2>
        <p>Chào mừng <strong id="displayName"></strong>!</p>
    </div>
</div>

<script src="Bai2.js"></script>
</body>
</html>
